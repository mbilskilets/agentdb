[package]
name = "agentdb"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
axum = "0.8.9"
hmac = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
strsim = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = "0.1.19"
ureq = { version = "3.4.2", features = ["json"] }

# Lints are warnings here so they never block a build while editing.
# `./check.sh` turns every warning into an error; that is the gate.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# no silencing a lint without a written reason: use #[expect(lint, reason = "...")]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# code that crashes at runtime instead of returning an error
unwrap_used = "warn"
expect_used = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic = "warn"
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unchecked_time_subtraction = "warn"
exit = "warn"
infinite_loop = "warn"

# errors that get thrown away
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# numbers that silently lose data
as_underscore = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"

# wasted work: copies, allocations, locks
redundant_clone = "warn"
clone_on_ref_ptr = "warn"
needless_collect = "warn"
or_fun_call = "warn"
iter_with_drain = "warn"
clear_with_drain = "warn"
collection_is_never_read = "warn"
set_contains_or_insert = "warn"
string_lit_as_bytes = "warn"
verbose_file_reads = "warn"
large_stack_frames = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
mem_forget = "warn"

# functions too tangled to review (thresholds in clippy.toml)
cognitive_complexity = "warn"
excessive_nesting = "warn"

# leftovers and consistency
dbg_macro = "warn"
use_self = "warn"
needless_pass_by_ref_mut = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
branches_sharing_code = "warn"
unused_peekable = "warn"
if_then_some_else_none = "warn"
rest_pat_in_fully_bound_structs = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
same_name_method = "warn"
tests_outside_test_module = "warn"
mod_module_files = "warn"

# dependency hygiene
wildcard_dependencies = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"

[dev-dependencies]
tempfile = "3.27.0"
